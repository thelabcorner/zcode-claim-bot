name: ci

on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: [self-hosted, homelab]
    if: github.actor == github.repository_owner
    steps:
      - uses: actions/checkout@v4

      - name: Runtime versions
        run: node --version

      - name: Syntax check all modules
        run: |
          for f in src/*.mjs; do node --check "$f" || exit 1; done
          echo "checked $(ls src/*.mjs | wc -l) modules"

      - name: Config resolves without throwing
        run: node -e "import('./src/config.mjs').then(()=>console.log('config ok'))"

      - name: No committed secrets
        env:
          # shape of a Telegram bot token: <digits>:<35 chars of A-Za-z0-9_->
          TOKEN_RE: '[0-9]{8,12}:[A-Za-z0-9_-]{35}'
        run: |
          # the real token must never live in this file; match by shape only
          if grep -rIEq "$TOKEN_RE" --exclude-dir=.git .; then
            echo "::error::telegram bot token found in tracked files"
            exit 1
          fi
          echo "clean"
